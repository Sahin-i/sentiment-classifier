name: Tests and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      REVIEW_SENTIMENT_HOME: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - name: Install CPU dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Check code style
        run: |
          ruff check .
          ruff format --check .
      - name: Verify frozen artifact checksums
        run: python scripts/verify_artifacts.py
      - name: Test recorded experiment and live inference
        run: python -m unittest discover -s tests -v
      - name: Test installed command
        run: review-sentiment --file examples/reviews.txt
      - name: Build distributable package
        run: python -m build
      - name: Test wheel independently of the source directory
        run: python scripts/check_wheel.py
