name: Bug report
description: Report a reproducible setup, inference or evaluation problem.
title: "[Bug]: "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Python version and installation command.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Paste the command, expected behavior and actual output. Use public or synthetic review text.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, credentials and private review text.
